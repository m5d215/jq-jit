name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # Cache the cargo registry and the release build tree so warm runs skip
      # recompiling the heavy third-party deps (cranelift, serde, proptest),
      # which dominate the job now that test execution is parallelized. The
      # key busts on the toolchain version and Cargo.lock; restore-keys lets a
      # changed lockfile still warm-start from the previous build tree.
      # actions/cache is GitHub-first-party (same trust boundary as the
      # checkout / upload-artifact actions already in use).
      - name: Capture toolchain version
        id: rust
        shell: bash
        run: echo "ver=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.ver }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.rust.outputs.ver }}-

      - name: Install jq 1.8.1 (for differential tests)
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    asset=jq-linux-amd64;       binary=jq     ;;
            Linux-ARM64)  asset=jq-linux-arm64;       binary=jq     ;;
            macOS-X64)    asset=jq-macos-amd64;       binary=jq     ;;
            macOS-ARM64)  asset=jq-macos-arm64;       binary=jq     ;;
            Windows-X64)  asset=jq-windows-amd64.exe; binary=jq.exe ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/jq181"
          mkdir -p "$dest"
          curl -L -o "$dest/$binary" "https://github.com/jqlang/jq/releases/download/jq-1.8.1/${asset}"
          chmod +x "$dest/$binary"
          "$dest/$binary" --version | grep -q '^jq-1\.8\.'
          echo "JQ_BIN=$dest/$binary" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: tests/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 30
