name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily full-matrix run: catches platform-specific regressions within a day
  # of merge (PR/push only gate on ubuntu) and gives the proptest suites a
  # fresh-seed fuzzing cadence. Owner is notified on failure.
  schedule:
    - cron: "17 15 * * *" # 00:17 JST
  # Manual full-matrix run on demand.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI only: drop LTO and maximise codegen parallelism to cut the test-binary
  # compile (~34% locally). Correctness is unaffected — LTO/codegen-units are
  # pure optimizations. The shipped binary keeps `lto = "thin"`: release.yml
  # has no such override, so the tag build still tests the production config.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # PR / push: ubuntu only (fast feedback). schedule / manual: full
        # 3-OS matrix. Release coverage on all three lives in release.yml,
        # which gates the tag build on `cargo test --release`.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "macos-latest", "windows-2025"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install jq 1.8.1 (for differential tests)
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    asset=jq-linux-amd64;       binary=jq     ;;
            Linux-ARM64)  asset=jq-linux-arm64;       binary=jq     ;;
            macOS-X64)    asset=jq-macos-amd64;       binary=jq     ;;
            macOS-ARM64)  asset=jq-macos-arm64;       binary=jq     ;;
            Windows-X64)  asset=jq-windows-amd64.exe; binary=jq.exe ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/jq181"
          mkdir -p "$dest"
          curl -L -o "$dest/$binary" "https://github.com/jqlang/jq/releases/download/jq-1.8.1/${asset}"
          chmod +x "$dest/$binary"
          "$dest/$binary" --version | grep -q '^jq-1\.8\.'
          echo "JQ_BIN=$dest/$binary" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: tests/proptest-regressions/
          if-no-files-found: ignore
          retention-days: 30
